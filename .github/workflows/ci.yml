name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      # @liangqingda/eslint-config is published to GitHub Packages under a
      # *separate* repo (liangqingda/eslint-config), so the automatic
      # GITHUB_TOKEN cannot read it. Authenticate with a classic PAT
      # (read:packages) stored as the GPR_READ_TOKEN repo secret.
      - name: Authenticate to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GPR_READ_TOKEN}" >> .npmrc
        env:
          GPR_READ_TOKEN: ${{ secrets.GPR_READ_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
